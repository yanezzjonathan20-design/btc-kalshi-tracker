name: Update Kalshi BTC data

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch open Kalshi BTC 15-minute markets
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXBTC15M&status=all&limit=1000"
          curl -fsSL --retry 3 --retry-delay 1 "$API" -o kalshi_raw.json
          BTC=$(curl -fsSL --retry 3 --retry-delay 1 "https://api.coinbase.com/v2/prices/BTC-USD/spot" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s); process.stdout.write(String(j.data.amount))})')

          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('kalshi_raw.json','utf8'));
          const now = Date.now();

          function n(v){
            const x=Number(v);
            return Number.isFinite(x)?x:null;
          }

          const markets=(raw.markets||[])
            .filter(m=>{
              const close=Date.parse(m.close_time||m.expected_expiration_time||"");
              const status=(m.status||"").toLowerCase();
              return Number.isFinite(close) && close>now && status!=="determined" && status!=="finalized";
            })
            .sort((a,b)=>Date.parse(a.close_time)-Date.parse(b.close_time))
            .slice(0,8)
            .map(m=>{
              const bid=n(m.yes_bid_dollars);
              const ask=n(m.yes_ask_dollars);
              const last=n(m.last_price_dollars);
              let yes=null;
              if(bid!==null && ask!==null) yes=(bid+ask)/2;
              else if(last!==null) yes=last;

              const target =
                n(m.floor_strike) ??
                n(m.floor_strike_dollars) ??
                n(m.functional_strike) ??
                n(m.custom_strike);

              return {
                ticker:m.ticker||null,
                event_ticker:m.event_ticker||null,
                title:m.title||"BTC price up in next 15 mins?",
                close_time:m.close_time||m.expected_expiration_time||null,
                target,
                yes_bid:bid,
                yes_ask:ask,
                yes_probability:yes,
                last_price:last
              };
            });

          fs.writeFileSync(
            "data.json",
            JSON.stringify({
              generated_at:new Date().toISOString(),
              ok:markets.length>0,
              source:"Kalshi public market data API",
              series:"KXBTC15M",
              markets,
              btc_spot:Number(BTC),
              error:markets.length?"No":"No open KXBTC15M markets were returned."
            },null,2)+"\n"
          );
          NODE

      - name: Publish data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "Update live Kalshi BTC data"
          git fetch origin main
          git rebase origin/main
          git push
