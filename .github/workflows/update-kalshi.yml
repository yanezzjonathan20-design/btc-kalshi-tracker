name: Update Kalshi BTC data

on:
  push:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current Kalshi BTC 15-minute market
        shell: bash
        run: |
          set -euo pipefail

          API="https://external-api.kalshi.com/trade-api/v2/markets?series_ticker=KXBTC15M&status=open&limit=100"
          curl -fsSL --retry 3 --retry-delay 1 "$API" -o kalshi_raw.json

          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('kalshi_raw.json','utf8'));
          const now = Date.now();

          const markets = (raw.markets || [])
            .filter(m => {
              const close = Date.parse(m.close_time || m.expected_expiration_time || "");
              return Number.isFinite(close) && close > now;
            })
            .sort((a,b) => Date.parse(a.close_time) - Date.parse(b.close_time));

          const m = markets[0] || null;

          function n(v){
            const x = Number(v);
            return Number.isFinite(x) ? x : null;
          }

          const target =
            n(m?.floor_strike) ??
            n(m?.floor_strike_dollars) ??
            n(m?.functional_strike) ??
            n(m?.custom_strike);

          const bid = n(m?.yes_bid_dollars);
          const ask = n(m?.yes_ask_dollars);
          const last = n(m?.last_price_dollars);
          let yes = null;
          if (bid !== null && ask !== null) yes = (bid + ask) / 2;
          else if (last !== null) yes = last;

          const payload = {
            generated_at: new Date().toISOString(),
            ok: !!m,
            source: "Kalshi public market data API",
            series: "KXBTC15M",
            market: m ? {
              ticker: m.ticker || null,
              event_ticker: m.event_ticker || null,
              title: m.title || "BTC 15 min",
              close_time: m.close_time || m.expected_expiration_time || null,
              target: target,
              yes_bid: bid,
              yes_ask: ask,
              yes_probability: yes,
              last_price: last
            } : null,
            error: m ? null : "No open KXBTC15M market was returned."
          };

          fs.writeFileSync("data.json", JSON.stringify(payload, null, 2) + "\n");
          NODE

      - name: Publish data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -m "Update live Kalshi BTC data"
          git fetch origin main
          git rebase origin/main
          git push
